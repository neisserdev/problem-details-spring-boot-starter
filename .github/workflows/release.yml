name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pom.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pom
        name: Comparar tag y pom
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión del pom ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pruebas:
    needs: version
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar en Maven Central
    needs: [version, pruebas]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: maven-central
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      # Los tests ya pasaron en el job anterior
      - name: Firmar y publicar
        run: >-
          mvn -B -ntp clean deploy -Prelease -DskipTests
          -Dgpg.signer=bc -Dgpg.bestPractices=true
          -Dcentral.autoPublish=true -Dcentral.waitUntil=published
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Crear release en GitHub
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --title "$GITHUB_REF_NAME"
          target/problem-details-spring-boot-starter-"$VERSION"*.jar
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resumen
        run: |
          {
            echo "### io.github.neisserdev:problem-details-spring-boot-starter:$VERSION"
            echo "Publicado en Maven Central."
          } >> "$GITHUB_STEP_SUMMARY"
