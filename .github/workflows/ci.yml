name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Java ${{ matrix.java }} - Boot ${{ matrix.boot == 'pom' && 'current' || matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        # Oldest supported version and the one in the pom
        boot: ['4.0.8', 'pom']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify ${{ matrix.boot != 'pom' && format('-Dspring-boot.version={0}', matrix.boot) || '' }}

  # Javadoc and sources as in the release, unsigned
  package:
    name: Release packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build javadoc and sources
        run: mvn -B -ntp verify -Prelease -DskipTests -Dgpg.skip
